<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 수학학술제 - 경로 탐색 알고리즘 시뮬레이션</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Malgun Gothic", sans-serif; background:#f4f6f8; color:#1f2937; }
    .wrap { max-width: 1500px; margin: 0 auto; padding: 18px; }
    h1 { margin: 0 0 6px; font-size: 25px; }
    .sub { color:#6b7280; margin-bottom:16px; }
    .panel { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 3px 12px rgba(0,0,0,.05); }
    .controls { display:grid; grid-template-columns: 1fr 1fr 1fr 1.3fr; gap:10px; }
    label { display:block; font-size:13px; font-weight:700; margin-bottom:5px; }
    select, button, input[type=range] { width:100%; }
    select, button { height:40px; border:1px solid #d1d5db; border-radius:9px; padding:0 10px; background:#fff; }
    button { background:#1976d2; color:#fff; border:0; font-weight:700; cursor:pointer; }
    button:hover { filter:brightness(.95); }
    .traffic { display:grid; grid-template-columns: 2fr 1fr 130px 140px; gap:10px; align-items:end; }
    .rangebox { display:flex; gap:10px; align-items:center; }
    .rangebox span { min-width:45px; font-weight:700; }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .metric { background:#f8fafc; border-radius:10px; padding:11px; }
    .metric b { display:block; font-size:18px; margin-top:3px; }
    #map { height:650px; border-radius:12px; overflow:hidden; }
    .bottom { display:grid; grid-template-columns: 1fr 320px; gap:12px; }
    .status { font-weight:700; min-height:24px; }
    .path { line-height:1.7; word-break:keep-all; }
    .legend { font-size:13px; line-height:1.8; }
    .legend span { display:inline-block; width:28px; height:4px; margin-right:5px; vertical-align:middle; }
    .stepbox { display:flex; gap:10px; align-items:center; }
    #stepSlider { flex:1; }
    @media(max-width:900px) {
      .controls, .traffic, .metrics, .bottom { grid-template-columns:1fr; }
      #map { height:520px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>2026 수학학술제 경로 탐색 알고리즘 시뮬레이션</h1>
  <div class="sub">다익스트라 · A* · 벨먼-포드 · 플로이드-워셜 비교</div>

  <div class="panel controls">
    <div>
      <label>알고리즘</label>
      <select id="algorithm">
        <option>다익스트라</option>
        <option>A*</option>
        <option>벨먼-포드</option>
        <option>플로이드-워셜</option>
      </select>
    </div>
    <div>
      <label>출발지</label>
      <select id="start">{% for n in nodes %}<option {% if n=="오현중학교" %}selected{% endif %}>{{n}}</option>{% endfor %}</select>
    </div>
    <div>
      <label>목적지</label>
      <select id="end">{% for n in nodes %}<option {% if n=="성산일출봉" %}selected{% endif %}>{{n}}</option>{% endfor %}</select>
    </div>
    <div style="display:flex;align-items:end">
      <button id="run">경로 재탐색</button>
    </div>
  </div>

  <div class="panel traffic">
    <div>
      <label>정체/통제 구간</label>
      <select id="trafficEdge">
        {% for u,v in edges %}<option value="{{loop.index0}}">{{u}} ↔ {{v}}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>정체 지수</label>
      <div class="rangebox">
        <input id="trafficFactor" type="range" min="1" max="4" step=".1" value="2.5">
        <span id="factorText">2.5x</span>
      </div>
    </div>
    <div>
      <label>&nbsp;</label>
      <label style="font-weight:500"><input id="blocked" type="checkbox"> 완전 통행 차단</label>
    </div>
    <div>
      <label>&nbsp;</label>
      <button id="resetView" style="background:#64748b">지도 초기화</button>
    </div>
  </div>

  <div class="panel metrics">
    <div class="metric">탐색 시간<b id="time">- ms</b></div>
    <div class="metric">메모리 사용량<b id="memory">- KB</b></div>
    <div class="metric">경로 거리<b id="distance">-</b></div>
    <div class="metric">예상 소요 시간<b id="eta">-</b></div>
  </div>

  <div class="panel">
    <div id="map"></div>
  </div>

  <div class="panel">
    <div class="stepbox">
      <strong>탐색 과정</strong>
      <button id="playPause" style="width:110px;background:#16a34a;">자동 재생</button>
      <input id="stepSlider" type="range" min="0" max="0" value="0" disabled>
      <span id="stepText">0 / 0</span>
    </div>
    <div class="status" id="status">경로를 탐색하면 알고리즘의 진행 과정이 지도에 표시됩니다.</div>
  </div>

  <div class="bottom">
    <div class="panel">
      <h3>최단 경로</h3>
      <div class="path" id="path">-</div>
    </div>
    <div class="panel legend">
      <h3>범례</h3>
      <div><span style="background:#666"></span>일반 도로</div>
      <div><span style="background:#e53935"></span>정체 구간</div>
      <div><span style="background:#000;border-top:2px dashed #fff"></span>통제 구간</div>
      <div><span style="background:#ff9800"></span>현재 탐색 간선</div>
      <div><span style="background:#0055ff"></span>최종 최적 경로</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const nodes = {{ nodes|tojson }};
const edges = {{ edges|tojson }};

const map = L.map('map').setView([33.38,126.55], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const normalLayer = L.layerGroup().addTo(map);
const nodeLayer = L.layerGroup().addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const stepLayer = L.layerGroup().addTo(map);

let geometry = [];
let nodeMarkers = {};
let lastResult = null;

// 원본 PyQt5 프로그램의 QTimer(35ms) 자동 단계 진행을 웹에서도 구현
let autoPlayTimer = null;
let autoPlaying = false;
const AUTO_PLAY_INTERVAL = 35;

async function loadMapData() {
  const [g, n] = await Promise.all([
    fetch('/api/edge-geometry').then(r=>r.json()),
    fetch('/api/nodes').then(r=>r.json())
  ]);
  geometry = g;

  normalLayer.clearLayers();
  nodeLayer.clearLayers();

  geometry.forEach(e => {
    L.polyline(e.coordinates, {color:'#666', weight:2, opacity:.45}).addTo(normalLayer);
  });

  n.forEach(x => {
    const marker = L.circleMarker([x.lat,x.lon], {
      radius:5, color:'#444', fillColor:'#fff', fillOpacity:1, weight:1
    }).bindTooltip(x.name, {permanent:false});
    marker.addTo(nodeLayer);
    nodeMarkers[x.name] = marker;
  });
}

function edgeGeometry(u,v) {
  return geometry.find(e => (e.u===u && e.v===v) || (e.u===v && e.v===u));
}

function clearDynamic() {
  routeLayer.clearLayers();
  stepLayer.clearLayers();
}

function drawTraffic() {
  geometry.forEach(e => {
    const idx = edges.findIndex(x => (x[0]===e.u && x[1]===e.v) || (x[0]===e.v && x[1]===e.u));
    const selected = String(idx) === document.getElementById('trafficEdge').value;
    const blocked = document.getElementById('blocked').checked;
    L.polyline(e.coordinates, {
      color: selected ? (blocked ? '#000' : '#e53935') : '#666',
      weight: selected ? 5 : 2,
      opacity: selected ? .9 : .4,
      dashArray: selected && blocked ? '8 8' : null
    }).addTo(stepLayer);
  });
}

function drawStep(step) {
  clearDynamic();
  drawTraffic();

  if (!step) return;

  if (step.type === 'relax' && step.active_edge) {
    const [u,v] = step.active_edge;
    const e = edgeGeometry(u,v);
    if(e) L.polyline(e.coordinates,{color:'#ff9800',weight:5,opacity:.95}).addTo(stepLayer);
  }

  if (step.type === 'done') {
    const p = step.path || [];
    for(let i=0;i<p.length-1;i++) {
      const e = edgeGeometry(p[i],p[i+1]);
      if(e) L.polyline(e.coordinates,{color:'#0055ff',weight:6,opacity:.9}).addTo(routeLayer);
    }
  }

  const start = document.getElementById('start').value;
  const end = document.getElementById('end').value;
  Object.entries(nodeMarkers).forEach(([name,m]) => {
    const selected = name===start ? '#4caf50' : name===end ? '#f44336' : '#444';
    m.setStyle({radius:(name===start||name===end)?9:5, color:selected, fillColor:selected});
  });
}

function updateStep() {
  if(!lastResult) return;
  const s = Number(document.getElementById('stepSlider').value);
  const total = lastResult.steps.length;
  document.getElementById('stepText').textContent = `${s+1} / ${total}`;
  drawStep(lastResult.steps[s]);
  const step = lastResult.steps[s];
  if(step.type === 'done') {
    const p = step.path || [];
    document.getElementById('status').textContent =
      p.length ? `[최적 경로 완료] ${p.join(' → ')}` : '[경로 없음] 통행 가능한 경로가 없습니다.';
  } else {
    document.getElementById('status').textContent = `[탐색 진행 중] ${s+1} / ${total} 단계`;
  }
}

function stopAutoPlay() {
  if (autoPlayTimer !== null) {
    clearInterval(autoPlayTimer);
    autoPlayTimer = null;
  }
  autoPlaying = false;
  document.getElementById('playPause').textContent = '자동 재생';
  document.getElementById('playPause').style.background = '#16a34a';
}

function startAutoPlay() {
  if (!lastResult || !lastResult.steps || lastResult.steps.length === 0) return;

  stopAutoPlay();
  autoPlaying = true;
  document.getElementById('playPause').textContent = '일시정지';
  document.getElementById('playPause').style.background = '#f59e0b';

  autoPlayTimer = setInterval(() => {
    const slider = document.getElementById('stepSlider');
    const current = Number(slider.value);

    if (current >= lastResult.steps.length - 1) {
      stopAutoPlay();
      updateStep();
      return;
    }

    slider.value = current + 1;
    updateStep();
  }, AUTO_PLAY_INTERVAL);
}

function toggleAutoPlay() {
  if (!lastResult) return;

  if (autoPlaying) {
    stopAutoPlay();
  } else {
    const slider = document.getElementById('stepSlider');

    // 마지막 단계에서 다시 누르면 처음부터 재생
    if (Number(slider.value) >= lastResult.steps.length - 1) {
      slider.value = 0;
      updateStep();
    }

    startAutoPlay();
  }
}

async function runRoute() {
  stopAutoPlay();

  const start = document.getElementById('start').value;
  const end = document.getElementById('end').value;
  if(start===end) {
    document.getElementById('status').textContent='출발지와 목적지가 같습니다.';
    return;
  }

  document.getElementById('status').textContent='탐색 중...';
  const payload = {
    algorithm: document.getElementById('algorithm').value,
    start, end,
    traffic_edge_index: Number(document.getElementById('trafficEdge').value),
    traffic_factor: Number(document.getElementById('trafficFactor').value),
    blocked: document.getElementById('blocked').checked
  };

  const res = await fetch('/api/route', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  const data = await res.json();

  if(!res.ok) {
    document.getElementById('status').textContent = data.error || '오류가 발생했습니다.';
    return;
  }

  lastResult = data;
  document.getElementById('time').textContent = `${data.elapsed_ms.toFixed(3)} ms`;
  document.getElementById('memory').textContent = `${data.peak_kb.toFixed(2)} KB`;

  if(data.distance_km == null) {
    document.getElementById('distance').textContent='측정 불가';
    document.getElementById('eta').textContent='측정 불가';
    document.getElementById('path').textContent='경로 없음';
  } else {
    document.getElementById('distance').textContent=`${data.distance_km.toFixed(1)} km`;
    const mins = data.eta_minutes;
    document.getElementById('eta').textContent =
      mins >= 60 ? `약 ${Math.floor(mins/60)}시간 ${mins%60}분` : `약 ${mins}분`;
    document.getElementById('path').textContent=data.path.join(' → ');
  }

  const slider=document.getElementById('stepSlider');
  slider.disabled=false;
  slider.max=Math.max(0,data.steps.length-1);
  slider.value=0;
  updateStep();

  // 탐색 결과를 받으면 자동으로 단계가 넘어감
  startAutoPlay();
}

document.getElementById('run').addEventListener('click', runRoute);

document.getElementById('stepSlider').addEventListener('input', () => {
  stopAutoPlay();
  updateStep();
});

document.getElementById('playPause').addEventListener('click', toggleAutoPlay);
document.getElementById('trafficFactor').addEventListener('input', e=>{
  document.getElementById('factorText').textContent=`${Number(e.target.value).toFixed(1)}x`;
});
document.getElementById('trafficEdge').addEventListener('change', ()=>{ if(lastResult) drawStep(lastResult.steps[Number(document.getElementById('stepSlider').value)]); });
document.getElementById('blocked').addEventListener('change', ()=>{ if(lastResult) drawStep(lastResult.steps[Number(document.getElementById('stepSlider').value)]); });
document.getElementById('resetView').addEventListener('click', ()=>map.setView([33.38,126.55],10));

loadMapData().catch(e=>{
  document.getElementById('status').textContent='지도 데이터를 불러오지 못했습니다. 인터넷 연결과 OSRM 서버 상태를 확인하세요.';
});
</script>
</body>
</html>
