<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
2026 수학학술제 경로 탐색 알고리즘
</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        "Malgun Gothic",
        sans-serif;

    background: #f4f6f8;

    color: #1f2937;
}

.wrap {

    max-width: 1500px;

    margin: auto;

    padding: 18px;
}

h1 {

    margin: 0 0 6px;

    font-size: 25px;
}

.sub {

    color: #6b7280;

    margin-bottom: 16px;
}

.panel {

    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 14px;

    padding: 14px;

    margin-bottom: 12px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.05);
}

.controls {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr 1.3fr;

    gap: 10px;
}

label {

    display: block;

    font-size: 13px;

    font-weight: 700;

    margin-bottom: 5px;
}

select,
button {

    width: 100%;

    height: 40px;

    border:
        1px solid #d1d5db;

    border-radius: 9px;

    padding: 0 10px;

    background: white;
}

button {

    background: #1976d2;

    color: white;

    border: 0;

    font-weight: 700;

    cursor: pointer;
}

button:hover {

    filter: brightness(.95);
}

.traffic {

    display: grid;

    grid-template-columns:
        2fr 1fr 130px 140px;

    gap: 10px;

    align-items: end;
}

.rangebox {

    display: flex;

    gap: 10px;

    align-items: center;
}

.rangebox span {

    min-width: 45px;

    font-weight: 700;
}

.metrics {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 10px;
}

.metric {

    background: #f8fafc;

    border-radius: 10px;

    padding: 11px;
}

.metric b {

    display: block;

    font-size: 18px;

    margin-top: 3px;
}

#map {

    height: 650px;

    border-radius: 12px;

    overflow: hidden;
}

.bottom {

    display: grid;

    grid-template-columns:
        1fr 320px;

    gap: 12px;
}

.status {

    font-weight: 700;

    min-height: 24px;

    margin-top: 12px;
}

.path {

    line-height: 1.7;

    word-break: keep-all;
}

.legend {

    font-size: 13px;

    line-height: 1.8;
}

.legend span {

    display: inline-block;

    width: 28px;

    height: 4px;

    margin-right: 5px;

    vertical-align: middle;
}

.stepbox {

    display: flex;

    gap: 10px;

    align-items: center;
}

#stepSlider {

    flex: 1;
}

#playPause {

    width: 110px;

    flex-shrink: 0;

    background: #16a34a;
}

@media(max-width:900px) {

    .controls,
    .traffic,
    .metrics,
    .bottom {

        grid-template-columns: 1fr;
    }

    #map {

        height: 520px;
    }
}

</style>

</head>


<body>

<div class="wrap">

<h1>
2026 수학학술제 경로 탐색 알고리즘 시뮬레이션
</h1>

<div class="sub">

다익스트라 · A* · 벨먼-포드 · 플로이드-워셜

</div>


<!-- 알고리즘 선택 -->

<div class="panel controls">

<div>

<label>
알고리즘
</label>

<select id="algorithm">

<option>
다익스트라
</option>

<option>
A*
</option>

<option>
벨먼-포드
</option>

<option>
플로이드-워셜
</option>

</select>

</div>


<div>

<label>
출발지
</label>

<select id="start">

{% for n in nodes %}

<option
{% if n == "오현중학교" %}
selected
{% endif %}
>

{{ n }}

</option>

{% endfor %}

</select>

</div>


<div>

<label>
목적지
</label>

<select id="end">

{% for n in nodes %}

<option
{% if n == "성산일출봉" %}
selected
{% endif %}
>

{{ n }}

</option>

{% endfor %}

</select>

</div>


<div>

<label>
&nbsp;
</label>

<button id="run">

경로 재탐색

</button>

</div>

</div>


<!-- 교통 -->

<div class="panel traffic">

<div>

<label>
정체/통제 구간
</label>

<select id="trafficEdge">

{% for u, v in edges %}

<option value="{{ loop.index0 }}">

{{ u }} ↔ {{ v }}

</option>

{% endfor %}

</select>

</div>


<div>

<label>
정체 지수
</label>

<div class="rangebox">

<input
id="trafficFactor"
type="range"
min="1"
max="4"
step="0.1"
value="2.5"
>

<span id="factorText">
2.5x
</span>

</div>

</div>


<div>

<label>
&nbsp;
</label>

<label style="font-weight:500">

<input
id="blocked"
type="checkbox"
>

완전 통행 차단

</label>

</div>


<div>

<label>
&nbsp;
</label>

<button
id="resetView"
style="background:#64748b"
>

지도 초기화

</button>

</div>

</div>


<!-- 성능 지표 -->

<div class="panel metrics">

<div class="metric">

탐색 시간

<b id="time">
-
</b>

</div>


<div class="metric">

메모리 사용량

<b id="memory">
-
</b>

</div>


<div class="metric">

경로 거리

<b id="distance">
-
</b>

</div>


<div class="metric">

예상 소요 시간

<b id="eta">
-
</b>

</div>

</div>


<!-- 지도 -->

<div class="panel">

<div id="map"></div>

</div>


<!-- 탐색 과정 -->

<div class="panel">

<div class="stepbox">

<strong>
탐색 과정
</strong>


<button id="playPause">

자동 재생

</button>


<input
id="stepSlider"
type="range"
min="0"
max="0"
value="0"
disabled
>


<span id="stepText">

0 / 0

</span>

</div>


<div
class="status"
id="status"
>

경로를 탐색하면 알고리즘의 진행 과정이 자동으로 표시됩니다.

</div>

</div>


<!-- 경로 -->

<div class="bottom">


<div class="panel">

<h3>
최단 경로
</h3>

<div
class="path"
id="path"
>
-
</div>

</div>


<div class="panel legend">

<h3>
범례
</h3>

<div>

<span
style="background:#666"
></span>

일반 도로

</div>


<div>

<span
style="background:#e53935"
></span>

정체 구간

</div>


<div>

<span
style="
background:#000;
border-top:2px dashed #fff
"
></span>

통제 구간

</div>


<div>

<span
style="background:#ff9800"
></span>

현재 탐색 간선

</div>


<div>

<span
style="background:#0055ff"
></span>

최종 최적 경로

</div>

</div>

</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

const nodes =
{{ nodes|tojson }};

const edges =
{{ edges|tojson }};


const map =
L.map("map").setView(
    [33.38,126.55],
    10
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


const normalLayer =
L.layerGroup().addTo(map);

const nodeLayer =
L.layerGroup().addTo(map);

const routeLayer =
L.layerGroup().addTo(map);

const stepLayer =
L.layerGroup().addTo(map);


let geometry = [];

let nodeMarkers = {};

let lastResult = null;


/*
============================================================
자동 재생
원본 PyQt5의 QTimer(35ms) 기능을 웹에서 구현
============================================================
*/

let autoPlayTimer = null;

let autoPlaying = false;

const AUTO_PLAY_INTERVAL = 35;


function stopAutoPlay() {

    if (autoPlayTimer !== null) {

        clearInterval(
            autoPlayTimer
        );

        autoPlayTimer = null;
    }

    autoPlaying = false;

    const button =
        document.getElementById(
            "playPause"
        );

    button.textContent =
        "자동 재생";

    button.style.background =
        "#16a34a";
}


function startAutoPlay() {

    if (
        !lastResult ||
        !lastResult.steps ||
        lastResult.steps.length === 0
    ) {

        return;
    }


    stopAutoPlay();

    autoPlaying = true;


    const button =
        document.getElementById(
            "playPause"
        );

    button.textContent =
        "일시정지";

    button.style.background =
        "#f59e0b";


    autoPlayTimer =
        setInterval(
            function() {

                const slider =
                    document.getElementById(
                        "stepSlider"
                    );


                const current =
                    Number(
                        slider.value
                    );


                /*
                마지막 단계 도착
                */

                if (
                    current >=
                    lastResult.steps.length - 1
                ) {

                    stopAutoPlay();

                    updateStep();

                    return;
                }


                /*
                다음 단계
                */

                slider.value =
                    current + 1;


                updateStep();

            },

            AUTO_PLAY_INTERVAL
        );
}


function toggleAutoPlay() {

    if (!lastResult) {

        return;
    }


    if (autoPlaying) {

        stopAutoPlay();

    } else {

        const slider =
            document.getElementById(
                "stepSlider"
            );


        /*
        마지막까지 갔다면
        처음부터 다시 시작
        */

        if (
            Number(slider.value)
            >=
            lastResult.steps.length - 1
        ) {

            slider.value = 0;

            updateStep();
        }


        startAutoPlay();
    }
}


/*
============================================================
지도 데이터
============================================================
*/

async function loadMapData() {

    const [
        geometryData,
        nodeData
    ] = await Promise.all([

        fetch(
            "/api/edge-geometry"
        ).then(
            r => r.json()
        ),

        fetch(
            "/api/nodes"
        ).then(
            r => r.json()
        )
    ]);


    geometry =
        geometryData;


    normalLayer.clearLayers();

    nodeLayer.clearLayers();


    geometry.forEach(
        function(edge) {

            L.polyline(
                edge.coordinates,
                {
                    color: "#666",

                    weight: 2,

                    opacity: .45
                }
            ).addTo(
                normalLayer
            );
        }
    );


    nodeData.forEach(
        function(node) {

            const marker =
                L.circleMarker(
                    [
                        node.lat,
                        node.lon
                    ],
                    {
                        radius: 5,

                        color: "#444",

                        fillColor: "#fff",

                        fillOpacity: 1,

                        weight: 1
                    }
                )
                .bindTooltip(
                    node.name
                );


            marker.addTo(
                nodeLayer
            );


            nodeMarkers[
                node.name
            ] = marker;
        }
    );
}


/*
============================================================
간선 검색
============================================================
*/

function edgeGeometry(
    u,
    v
) {

    return geometry.find(
        function(edge) {

            return (
                (
                    edge.u === u &&
                    edge.v === v
                )
                ||
                (
                    edge.u === v &&
                    edge.v === u
                )
            );

        }
    );
}


/*
============================================================
동적 레이어 삭제
============================================================
*/

function clearDynamic() {

    routeLayer.clearLayers();

    stepLayer.clearLayers();
}


/*
============================================================
정체 구간 표시
============================================================
*/

function drawTraffic() {

    geometry.forEach(
        function(edge) {

            const index =
                edges.findIndex(
                    function(item) {

                        return (
                            (
                                item[0] === edge.u &&
                                item[1] === edge.v
                            )
                            ||
                            (
                                item[0] === edge.v &&
                                item[1] === edge.u
                            )
                        );

                    }
                );


            const selected =
                String(index)
                ===
                document.getElementById(
                    "trafficEdge"
                ).value;


            const blocked =
                document.getElementById(
                    "blocked"
                ).checked;


            L.polyline(
                edge.coordinates,
                {

                    color:
                        selected
                        ?
                        (
                            blocked
                            ?
                            "#000"
                            :
                            "#e53935"
                        )
                        :
                        "#666",

                    weight:
                        selected
                        ?
                        5
                        :
                        2,

                    opacity:
                        selected
                        ?
                        .9
                        :
                        .4,

                    dashArray:
                        (
                            selected &&
                            blocked
                        )
                        ?
                        "8 8"
                        :
                        null
                }
            ).addTo(
                stepLayer
            );

        }
    );
}


/*
============================================================
현재 단계 그리기
============================================================
*/

function drawStep(
    step
) {

    clearDynamic();

    drawTraffic();


    if (!step) {

        return;
    }


    /*
    현재 탐색 중인 간선
    */

    if (
        step.type === "relax" &&
        step.active_edge
    ) {

        const [
            u,
            v
        ] =
            step.active_edge;


        const edge =
            edgeGeometry(
                u,
                v
            );


        if (edge) {

            L.polyline(
                edge.coordinates,
                {

                    color:
                        "#ff9800",

                    weight:
                        5,

                    opacity:
                        .95
                }
            ).addTo(
                stepLayer
            );
        }
    }


    /*
    최종 경로
    */

    if (
        step.type === "done"
    ) {

        const path =
            step.path || [];


        for (
            let i = 0;
            i < path.length - 1;
            i++
        ) {

            const edge =
                edgeGeometry(
                    path[i],
                    path[i + 1]
                );


            if (edge) {

                L.polyline(
                    edge.coordinates,
                    {

                        color:
                            "#0055ff",

                        weight:
                            6,

                        opacity:
                            .9
                    }
                ).addTo(
                    routeLayer
                );
            }
        }
    }


    /*
    출발지 / 목적지 표시
    */

    const start =
        document.getElementById(
            "start"
        ).value;


    const end =
        document.getElementById(
            "end"
        ).value;


    Object.entries(
        nodeMarkers
    ).forEach(
        function([
            name,
            marker
        ]) {

            if (name === start) {

                marker.setStyle({
                    radius: 9,

                    color: "#4caf50",

                    fillColor: "#4caf50"
                });

            } else if (
                name === end
            ) {

                marker.setStyle({
                    radius: 9,

                    color: "#f44336",

                    fillColor: "#f44336"
                });

            } else {

                marker.setStyle({
                    radius: 5,

                    color: "#444",

                    fillColor: "#fff"
                });
            }

        }
    );
}


/*
============================================================
현재 단계 업데이트
============================================================
*/

function updateStep() {

    if (!lastResult) {

        return;
    }


    const slider =
        document.getElementById(
            "stepSlider"
        );


    const current =
        Number(
            slider.value
        );


    const total =
        lastResult.steps.length;


    document.getElementById(
        "stepText"
    ).textContent =
        `${current + 1} / ${total}`;


    const step =
        lastResult.steps[
            current
        ];


    drawStep(step);


    if (
        step.type === "done"
    ) {

        const path =
            step.path || [];


        if (
            path.length
        ) {

            document.getElementById(
                "status"
            ).textContent =
                "[최적 경로 완료] "
                +
                path.join(" → ");

        } else {

            document.getElementById(
                "status"
            ).textContent =
                "[경로 없음] 통행 가능한 경로가 없습니다.";
        }

    } else {

        document.getElementById(
            "status"
        ).textContent =
            `[탐색 진행 중] ${current + 1} / ${total} 단계`;
    }
}


/*
============================================================
경로 탐색
============================================================
*/

async function runRoute() {

    /*
    새로운 탐색을 시작하면
    이전 자동 재생 정지
    */

    stopAutoPlay();


    const start =
        document.getElementById(
            "start"
        ).value;


    const end =
        document.getElementById(
            "end"
        ).value;


    if (start === end) {

        document.getElementById(
            "status"
        ).textContent =
            "출발지와 목적지가 같습니다.";

        return;
    }


    document.getElementById(
        "status"
    ).textContent =
        "탐색 중...";


    const payload = {

        algorithm:
            document.getElementById(
                "algorithm"
            ).value,

        start:
            start,

        end:
            end,

        traffic_edge_index:
            Number(
                document.getElementById(
                    "trafficEdge"
                ).value
            ),

        traffic_factor:
            Number(
                document.getElementById(
                    "trafficFactor"
                ).value
            ),

        blocked:
            document.getElementById(
                "blocked"
            ).checked
    };


    const response =
        await fetch(
            "/api/route",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        document.getElementById(
            "status"
        ).textContent =
            data.error ||
            "오류가 발생했습니다.";

        return;
    }


    lastResult =
        data;


    /*
    성능 출력
    */

    document.getElementById(
        "time"
    ).textContent =
        `${data.elapsed_ms.toFixed(3)} ms`;


    document.getElementById(
        "memory"
    ).textContent =
        `${data.peak_kb.toFixed(2)} KB`;


    /*
    거리 / 시간
    */

    if (
        data.distance_km === null
    ) {

        document.getElementById(
            "distance"
        ).textContent =
            "측정 불가";


        document.getElementById(
            "eta"
        ).textContent =
            "측정 불가";


        document.getElementById(
            "path"
        ).textContent =
            "경로 없음";

    } else {

        document.getElementById(
            "distance"
        ).textContent =
            `${data.distance_km.toFixed(1)} km`;


        const minutes =
            data.eta_minutes;


        if (minutes >= 60) {

            document.getElementById(
                "eta"
            ).textContent =
                `약 ${Math.floor(minutes / 60)}시간 ${minutes % 60}분`;

        } else {

            document.getElementById(
                "eta"
            ).textContent =
                `약 ${minutes}분`;
        }


        document.getElementById(
            "path"
        ).textContent =
            data.path.join(
                " → "
            );
    }


    /*
    탐색 슬라이더
    */

    const slider =
        document.getElementById(
            "stepSlider"
        );


    slider.disabled = false;


    slider.max =
        Math.max(
            0,
            data.steps.length - 1
        );


    slider.value = 0;


    updateStep();


    /*
    ★ 핵심
    결과를 받으면 자동으로
    탐색 과정 재생
    */

    startAutoPlay();
}


/*
============================================================
버튼 이벤트
============================================================
*/

document.getElementById(
    "run"
).addEventListener(
    "click",
    runRoute
);


document.getElementById(
    "playPause"
).addEventListener(
    "click",
    toggleAutoPlay
);


/*
수동으로 슬라이더 움직이면
자동 재생 중지
*/

document.getElementById(
    "stepSlider"
).addEventListener(
    "input",
    function() {

        stopAutoPlay();

        updateStep();
    }
);


/*
정체 지수
*/

document.getElementById(
    "trafficFactor"
).addEventListener(
    "input",
    function(event) {

        document.getElementById(
            "factorText"
        ).textContent =
            `${Number(
                event.target.value
            ).toFixed(1)}x`;
    }
);


/*
정체 구간 변경
*/

document.getElementById(
    "trafficEdge"
).addEventListener(
    "change",
    function() {

        if (!lastResult)
            return;


        drawStep(
            lastResult.steps[
                Number(
                    document.getElementById(
                        "stepSlider"
                    ).value
                )
            ]
        );
    }
);


/*
통제 변경
*/

document.getElementById(
    "blocked"
).addEventListener(
    "change",
    function() {

        if (!lastResult)
            return;


        drawStep(
            lastResult.steps[
                Number(
                    document.getElementById(
                        "stepSlider"
                    ).value
                )
            ]
        );
    }
);


/*
지도 초기화
*/

document.getElementById(
    "resetView"
).addEventListener(
    "click",
    function() {

        map.setView(
            [33.38,126.55],
            10
        );
    }
);


/*
지도 데이터 최초 로딩
*/

loadMapData().catch(
    function(error) {

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
